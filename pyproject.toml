[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ubxtop"
version = "0.1.0"
description = "Zero-dependency 24-bit TrueColor TUI diagnostic suite for GNSS & u-blox receivers (UBX binary + NMEA 0183)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "James Greenhill", email = "fuziontech@gmail.com" }
]
requires-python = ">=3.9"
keywords = ["gps", "gnss", "u-blox", "ubx", "nmea", "tui", "telemetry", "radio", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fuziontech/ubxtop"
Repository = "https://github.com/fuziontech/ubxtop"
Issues = "https://github.com/fuziontech/ubxtop/issues"

[project.scripts]
ubxtop = "gps_tui:main"

[tool.setuptools]
py-modules = ["gps_tui", "gps_protocol", "gps_math", "gps_widgets"]
